services:
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.0}
    command:
      - --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-opencart}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-please_change_this_password}
    restart: always
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
  opencart:
    image: ${OPENCART_IMAGE:-ghcr.io/aam-git/docker-opencart:3.0.5.1}
    restart: always
    expose:
      - "80"
      - "443"
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      # The whole /var/www tree, including html/ and a storage directory moved beside it.
      - opencart_data:/var/www
    depends_on:
      - mysql
    environment:
      DB_HOSTNAME: ${DB_HOSTNAME:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-opencart}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-please_change_this_password}
      DB_DRIVER: ${DB_DRIVER:-mysqli}
      DB_PREFIX: ${DB_PREFIX:-oc_}
      OPENCART_USERNAME: ${OPENCART_USERNAME:-admin}
      OPENCART_PASSWORD: ${OPENCART_PASSWORD:-please_change_this_password}
      OPENCART_EMAIL: ${OPENCART_EMAIL:-admin@example.com}
      OPENCART_FIRSTNAME: ${OPENCART_FIRSTNAME:-}
      OPENCART_LASTNAME: ${OPENCART_LASTNAME:-}
      OPENCART_SITE_NAME: ${OPENCART_SITE_NAME:-}
      OPENCART_SITE_URL: ${OPENCART_SITE_URL:-http://localhost}
      PHP_MAX_EXECUTION_TIME: ${PHP_MAX_EXECUTION_TIME:-300}
      PHP_MEMORY_LIMIT: ${PHP_MEMORY_LIMIT:-256M}
      TZ: ${TZ:-UTC}

volumes:
  mysql_data:
  opencart_data:
