# OpenCart is served from /var/www/html. Debian's default for /var/www
# sets AllowOverride None, which disables the shop's .htaccess.
ServerName localhost

# Cloudflare sets CF-Connecting-IP. Traefik forwards that header and is the
# only host that should connect to Apache. Trust it from private networks
# so OpenCart sees the visitor IP instead of the proxy.
RemoteIPHeader CF-Connecting-IP
RemoteIPInternalProxy 10.0.0.0/8
RemoteIPInternalProxy 172.16.0.0/12
RemoteIPInternalProxy 192.168.0.0/16
RemoteIPInternalProxy 127.0.0.1

<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    DirectoryIndex index.php index.html
    Require all granted
</Directory>

# Block HTTP access even when .htaccess is missing. PHP can still read these files.
<Files "config.php">
    Require all denied
</Files>

<Directory /var/www/html/system/storage>
    Require all denied
</Directory>
