# OpenCart is served from /var/www/html. Debian's default for /var/www
# sets AllowOverride None, which disables the shop's .htaccess.
ServerName localhost

<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    DirectoryIndex index.php index.html
    Require all granted
</Directory>

# Block HTTP access even when .htaccess is missing. PHP can still read these files.
<Files "config.php">
    Require all denied
</Files>

<Directory /var/www/html/system/storage>
    Require all denied
</Directory>
